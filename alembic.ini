# Alembic configuration for the Promptworks data layer.
#
# There is deliberately no `sqlalchemy.url` here: the connection string is a
# credential and lives in .env, which is gitignored. alembic/env.py reads
# DATABASE_URL from the environment instead, so this file stays committable.
#
# Usage, from the repo root:
#   alembic upgrade head                      # apply migrations
#   alembic revision --autogenerate -m "..."  # new migration after a model change
#   alembic downgrade -1                      # undo the last one

[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os

# Timestamped filenames so `ls alembic/versions` reads in the order the
# migrations were written, not in random hash order.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
